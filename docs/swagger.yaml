  contact: {}
paths:
  /:
    get:
      description: Check if the API is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Welcome
      tags:
      - Health
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate the provided refresh token
      parameters:
      - description: Refresh Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Auth
  /auth/renew:
    post:
      consumes:
      - application/json
      description: Generate a new access token using a valid refresh token
      parameters:
      - description: Refresh Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-internal_auth_TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
      summary: Renew access token
      tags:
      - Auth
  /auth/signin:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access + refresh token
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-internal_auth_TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
      summary: Login user
      tags:
      - Auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Create a new user account (ProjectAdmin only)
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-internal_auth_RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
      security:
      - BearerAuth: []
      summary: Register new user
      tags:
      - Auth
  /user/{id}/reset-password:
    put:
      consumes:
      - application/json
      description: ProjectAdmin resets any user's password. Does not require the current
        password. Forces logout on all active sessions.
      parameters:
      - description: Target User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Reset Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_user.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-internal_user_ResetPasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
      security:
      - BearerAuth: []
      summary: Reset a user's password (Admin)
      tags:
      - User
  /user/change-password:
    put:
      consumes:
      - application/json
      description: Authenticated user changes their own password. Requires current
        password.
      parameters:
      - description: Change Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_user.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-internal_user_ChangePasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
      security:
      - BearerAuth: []
      summary: Change own password
      tags:
      - User
  /user/current:
    get:
      description: Get the authentication user details
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-internal_user_UserDetailsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_rizqdwan_go-mono-project_pkg_response.WebResponse-any'
      security:
      - BearerAuth: []
      summary: Get current user details
      tags:
      - User
